name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (Xcode 26.1)
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.1'

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Show tool versions
        run: |
          xcodebuild -version
          swift --version
          node -v
          pnpm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Swift packages and build products
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-xcode26.1-${{ hashFiles('Package.swift', 'Package.resolved') }}

      - name: Resolve Swift packages
        run: swift package resolve

      - name: Install pinned SwiftLint and SwiftFormat
        run: |
          mkdir -p "$RUNNER_TEMP/repobar-tools"
          cd "$RUNNER_TEMP/repobar-tools"
          curl -fsSL --retry 3 https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip -o swiftlint.zip
          curl -fsSL --retry 3 https://github.com/nicklockwood/SwiftFormat/releases/download/0.63.1/swiftformat.zip -o swiftformat.zip
          printf '%s\n' 'c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  swiftlint.zip' | shasum -a 256 -c -
          printf '%s\n' '385ef1a263ba28685157b98c5536b9c9105e124518f28b7ef8a2bee4b167eaeb  swiftformat.zip' | shasum -a 256 -c -
          unzip -q swiftlint.zip -d swiftlint
          unzip -q swiftformat.zip -d swiftformat
          "$PWD/swiftlint/swiftlint" version
          "$PWD/swiftformat/swiftformat" --version
          printf '%s\n' "$PWD/swiftlint" "$PWD/swiftformat" >> "$GITHUB_PATH"

      - name: Run checks
        run: pnpm check

      - name: Select Xcode for iOS
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6'

      - name: Build iOS app and tests
        run: |
          xcodebuild -project RepoBariOS/RepoBariOS.xcodeproj -scheme RepoBariOS \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/repobar-ios" \
            ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build-for-testing

      - name: Verify formatting and lockfiles are unchanged
        run: git diff --exit-code
