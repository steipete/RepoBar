name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  macos:
    name: macOS (Xcode 26.1)
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1'

      - name: Show tool versions
        run: |
          xcodebuild -version
          swift --version
          node -v || true
          pnpm -v || true

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Swift packages
        run: swift package resolve

      - name: Install SwiftLint/SwiftFormat
        run: |
          for tool in swiftlint swiftformat; do
            if brew list --formula "$tool" >/dev/null 2>&1; then
              if brew outdated --quiet "$tool" | grep -qx "$tool"; then
                brew upgrade "$tool"
              else
                brew list --versions "$tool"
              fi
            else
              brew install "$tool"
            fi
          done

      - name: Run checks
        run: pnpm check

  windows:
    name: Windows tray
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: '8.0.x'

      - name: Build tray
        shell: pwsh
        run: ./Scripts/build_windows.ps1 build -Runtime win-x64

      - name: Test tray
        shell: pwsh
        run: ./Scripts/build_windows.ps1 test

      - name: Upload Windows test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repobar-windows-test-results
          path: dist/windows/test-results
          if-no-files-found: warn

      - name: Smoke tray
        shell: pwsh
        run: ./Scripts/smoke_windows.ps1 -Runtime win-x64 -LaunchSeconds 5

      - name: Upload Windows smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repobar-windows-smoke
          path: dist/windows/smoke
          if-no-files-found: warn

      - name: Package tray layout
        shell: pwsh
        run: ./Scripts/package_windows.ps1 -Runtime win-x64 -SkipInstaller

      - name: Upload unsigned tray layout
        uses: actions/upload-artifact@v7
        with:
          name: repobar-windows-win-x64-unsigned
          path: dist/windows/publish/win-x64

      - name: Package ARM64 tray layout
        shell: pwsh
        run: ./Scripts/package_windows.ps1 -Runtime win-arm64 -SkipInstaller

      - name: Upload unsigned ARM64 tray layout
        uses: actions/upload-artifact@v7
        with:
          name: repobar-windows-win-arm64-unsigned
          path: dist/windows/publish/win-arm64

      - name: Validate Windows proof artifacts
        shell: pwsh
        run: ./Scripts/Test-WindowsValidationArtifacts.ps1

      - name: Upload Windows validation manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repobar-windows-validation
          path: dist/windows/smoke/repobar-windows-validation.json
          if-no-files-found: warn

  windows-signing:
    name: Windows signing
    needs: windows
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    timeout-minutes: 15
    environment: release-signing
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Download unsigned tray layout
        uses: actions/download-artifact@v8
        with:
          name: repobar-windows-win-x64-unsigned
          path: dist/windows/publish/win-x64

      - name: Azure Login for Release Signing
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Stage RepoBar Executable for Signing
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path signing-input-win-x64 -Force | Out-Null
          New-Item -ItemType HardLink -Path signing-input-win-x64\RepoBar.Windows.exe -Target dist\windows\publish\win-x64\RepoBar.Windows.exe | Out-Null

      - name: Sign RepoBar Windows Executable
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://wus2.codesigning.azure.net/
          signing-account-name: hanselman
          certificate-profile-name: WindowsEdgeLight
          files-folder: signing-input-win-x64
          files-folder-filter: exe
          files-folder-depth: 1
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify RepoBar Windows Signing Policy
        shell: pwsh
        run: ./Scripts/Test-WindowsReleaseSignatures.ps1 -PayloadPath dist/windows/publish/win-x64 -RequireSignedRepoBar

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Build Windows installer from signed layout
        shell: pwsh
        run: |
          $version = "0.1.0"
          if (Test-Path version.env) {
            $line = Get-Content version.env | Where-Object { $_ -match '^(MARKETING_VERSION|VERSION)=' } | Select-Object -First 1
            if ($line) {
              $version = $line -replace '^(MARKETING_VERSION|VERSION)=', ''
            }
          }

          $env:REPOBAR_WINDOWS_VERSION = $version
          $env:REPOBAR_WINDOWS_PUBLISH_DIR = (Resolve-Path dist/windows/publish/win-x64).Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" Windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC.exe exited with code $LASTEXITCODE" }

      - name: Sign RepoBar Windows Installer
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://wus2.codesigning.azure.net/
          signing-account-name: hanselman
          certificate-profile-name: WindowsEdgeLight
          files-folder: dist/windows
          files-folder-filter: exe
          files-folder-depth: 1
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify RepoBar Windows Installer Signature
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath dist/windows -File -Filter "RepoBar-Windows-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "RepoBar Windows installer was not produced." }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne "Valid") { throw "$($installer.Name) signature was $($signature.Status)." }

      - name: Upload signed tray layout
        uses: actions/upload-artifact@v7
        with:
          name: repobar-windows-win-x64-signed
          path: dist/windows/publish/win-x64

      - name: Upload signed Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: repobar-windows-installer-win-x64-signed
          path: dist/windows/RepoBar-Windows-*.exe
